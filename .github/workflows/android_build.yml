name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enxcci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name enxcci .
      - run: flutter pub get
      - name: Align flutter_js Kotlin target with Java 11
        run: |
          cat >> android/build.gradle <<'EOF'
          subprojects { pluginProject ->
              if (pluginProject.name == "flutter_js") {
                  pluginProject.afterEvaluate {
                      pluginProject.tasks.matching { task ->
                          task.name.endsWith("Kotlin")
                      }.configureEach { task ->
                          task.kotlinOptions.jvmTarget = "11"
                      }
                  }
              }
          }
          EOF
      - name: Generate App Icons
        run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: enxcci/build/app/outputs/flutter-apk/app-release.apk
          